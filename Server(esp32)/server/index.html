<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Painel ESP32</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    #controls { margin-bottom: 1rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    select, input[type="text"] { padding: 8px; }
    #commandInput { width: 300px; }
    button { padding: 8px 16px; cursor: pointer; }
    #log { width: 100%; height: 320px; border: 1px solid #ccc; overflow-y: auto; padding: 5px; }
    #log p { margin: 0; font-family: monospace; }
  </style>
</head>
<body>
  <div id="loginOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;">
    <h2>Login</h2>
    <input type="text" id="loginUser" placeholder="Usuário" style="padding:8px;margin-bottom:8px;"/>
    <input type="password" id="loginPass" placeholder="Senha" style="padding:8px;margin-bottom:8px;"/>
    <button id="loginBtn" style="padding:8px 16px;">Entrar</button>
    <p id="loginError" style="color:red;margin-top:8px;"></p>
  </div>

  <h1 id="mainTitle" style="display:none;">Painel de Controle ESP32</h1>

  <div id="controls" style="display:none;">
    <label for="espSelect">ESP32:</label>
    <select id="espSelect"></select>
    <span id="espInfo"></span>
    <button id="refreshBtn" title="Atualizar lista de ESP32s">🔄 Atualizar</button>
    <input type="text" id="commandInput" placeholder="Digite o comando..." />
    <button id="sendBtn">Enviar</button>
  </div>

  <div id="log" style="display:none;"></div>

  <h2 id="espHeader" style="display:none;">ESPs conectados</h2>
  <table id="espTable" border="1" cellpadding="4" cellspacing="0" style="display:none;">
    <thead>
      <tr><th>ID</th><th>SSID</th><th>Email</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // ======= Configurações de URL =======
    const BASE_URL = ''; // Backend na mesma origem
    const WS_URL   = location.origin.replace(/^http/, 'ws') + '/ws'; // WebSocket local

    const logEl = document.getElementById('log');
    const espSelect = document.getElementById('espSelect');
    const cmdInput = document.getElementById('commandInput');

    function addLog(msg) {
      const p = document.createElement('p');
      const ts = new Date().toLocaleTimeString();
      p.textContent = `[${ts}] ${msg}`;
      logEl.appendChild(p);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // WebSocket para receber mensagens em tempo-real
    function initWebSocket() {
      const ws = new WebSocket(WS_URL);

      ws.addEventListener('open', () => addLog('WebSocket conectado.'));
      ws.addEventListener('message', (e) => addLog(e.data));
      ws.addEventListener('close', () => {
        addLog('WebSocket desconectado. Tentando reconectar em 3s...');
        setTimeout(initWebSocket, 3000);
      });
      ws.addEventListener('error', (err) => addLog('Erro WebSocket: ' + err.message));
    }
    initWebSocket();

    // Buscar lista de ESPs
    async function fetchEspList() {
      try {
        const res = await fetch(BASE_URL + '/api/list', {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' },
        });
        const json = await res.json();
        console.log(json);

        // Limpa tabela e dropdown
        const tbody = document.querySelector('#espTable tbody');
        tbody.innerHTML = '';
        espSelect.innerHTML = json.length ? '' : '<option value="">Nenhum</option>';

        json.forEach(item => {
          let id, ssid = '', email = '';
          if (Array.isArray(item)) {
            id = item[0];
            const info = item[1]?._espInfo || {};
            ssid  = info.ssid  || '';
            email = info.email || '';
          } else if (item && typeof item === 'object') {
            id = item.id || '';
            ssid  = item.ssid  || '';
            email = item.email || '';
          } else {
            id = item;
          }

          // dropdown
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = id;
          espSelect.appendChild(opt);

          // tabela
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${id}</td><td>${ssid}</td><td>${email}</td>`;
          tbody.appendChild(tr);
        });
      } catch (e) {
        addLog('Falha ao obter /api/list: ' + e.message);
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', fetchEspList);
    fetchEspList(); // inicial

    // Enviar comando
    async function sendCommand() {
      const espId = espSelect.value;
      const cmd = cmdInput.value.trim();
      if (!espId) return addLog('Selecione um ESP32.');
      if (!cmd) return;
      const fullCmd = `${espId}:${cmd}`;
      try {
        const res = await fetch(BASE_URL + '/api/cmd', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: fullCmd,
        });
        const data = await res.json().catch(() => ({ error: 'Resposta não-JSON' }));
        if (data.error) {
          addLog('Erro: ' + data.error);
        } else if (data.response) {
          addLog('Resposta ESP: ' + data.response);
        } else {
          addLog('Comando enviado: ' + fullCmd);
        }
        cmdInput.value = '';
      } catch (e) {
        addLog('Falha HTTP: ' + e.message);
      }
    }

    document.getElementById('sendBtn').addEventListener('click', sendCommand);
    cmdInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendCommand();
    });

    // Atualiza info ao trocar ESP
    espSelect.addEventListener('change', () => {
      const selected = espSelect.value;
      const row = [...document.querySelectorAll('#espTable tbody tr')].find(r => r.firstChild.textContent === selected);
      if (row) {
        document.getElementById('espInfo').textContent = `SSID: ${row.children[1].textContent} | Email: ${row.children[2].textContent}`;
      } else {
        document.getElementById('espInfo').textContent = '';
      }
    });

    // ======= Autenticação simples =======
    const AUTH_USER = 'jesusateu'; // ajuste conforme necessário
    const AUTH_PASS = '123';

    document.getElementById('loginBtn').addEventListener('click', () => {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value.trim();
      if (u === AUTH_USER && p === AUTH_PASS) {
        document.getElementById('loginOverlay').style.display = 'none';
        // revelar conteúdo
        document.getElementById('mainTitle').style.display = '';
        document.getElementById('controls').style.display = 'flex';
        document.getElementById('log').style.display = '';
        document.getElementById('espHeader').style.display = '';
        document.getElementById('espTable').style.display = '';
      } else {
        document.getElementById('loginError').textContent = 'Credenciais inválidas';
      }
    });
  </script>
</body>
</html>
